<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coquette — Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-bg" aria-hidden="true"></div>

      <section class="login-card" aria-labelledby="login-title">
        <header class="login-header">
          <img
            src="/assets/coquette.png"
            alt=""
            class="login-logo"
            width="200"
            height="200"
          />
          <p class="login-brand">Coquette</p>
          <h1 id="login-title">Bienvenida</h1>
          <p class="login-subtitle">Accede a tu espacio vintage</p>
        </header>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label for="username">Usuario</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="Tu nombre de usuario"
              required
            />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </div>

          <p id="login-error" class="login-error" role="alert" hidden></p>

          <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p class="login-hint">
       <code>coquette</code> / <code>vintage2026</code>
        </p>
      </section>
    </main>

    <script type="module" src="/src/js/login.js"></script>
  </body>
</html>
